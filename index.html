<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뽀모도로 타이머</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Pomodoro Timer</h1>

    <!-- 모드 선택 버튼 -->
    <div class="mode-buttons">
      <button id="work-btn" class="mode-btn active" data-time="1500">작업 (25분)</button>
      <button id="short-break-btn" class="mode-btn" data-time="300">휴식 (5분)</button>
      <button id="long-break-btn" class="mode-btn" data-time="900">긴 휴식 (15분)</button>
    </div>

    <!-- 타이머 표시 -->
    <div class="timer-display" id="timer">25:00</div>

    <!-- 제어 버튼 -->
    <div class="control-buttons">
      <button id="start-btn" class="ctrl-btn">시작</button>
      <button id="pause-btn" class="ctrl-btn" disabled>일시정지</button>
      <button id="reset-btn" class="ctrl-btn">리셋</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
